; PlatformIO Project Configuration File — serial-comms
;
; Companion to MUNENE1212/LED. Explores UART and serial protocols on ESP32.
; One [env:NN_name] per exercise, following the src/NN_name/main.cpp pattern.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Exercise 01 — Serial hello: prints a greeting once a second.
[env:01_serial_hello]
build_src_filter = -<*> +<01_serial_hello/>

; --- Template for future exercises ---------------------------------
; 1. Create src/NN_<name>/main.cpp
; 2. Uncomment and rename the block below
; 3. Build with:  pio run -e NN_<name>
